# CRM Insight Agent - 一键启动基础设施
# 包含：MySQL 8（自动导入 Mock 数据）+ Redis Stack
# 联网搜索模式需要的 SearXNG 见 backend/scripts/docker/docker-compose.yml

services:
  redis-stack:
    image: redis/redis-stack:latest
    container_name: crm-redis
    ports:
      - "9379:6379"
      - "8001:8001"   # RedisInsight 可视化
    volumes:
      - ./volumes/redis:/data
    environment:
      - REDIS_ARGS=--requirepass 123456
    restart: always

  mysql:
    image: mysql:8.0.24
    container_name: crm-mysql
    ports:
      - "3336:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 10s
      retries: 10
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: "crmtest"
    restart: always
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--skip-character-set-client-handshake"]
    volumes:
      - ./volumes/mysql:/var/lib/mysql
      # 强制 utf8mb4：防止 initdb 阶段 mysql 客户端以 latin1 解释 UTF-8 SQL 导致双重编码
      - "./backend/mock-data/init/my.cnf:/etc/mysql/conf.d/charset.cnf:ro"
      # 首次初始化自动建表并导入 Mock 数据（先运行 backend/mock-data/generate_mock_data.py 生成）
      - "./backend/mock-data/init:/docker-entrypoint-initdb.d:ro"
