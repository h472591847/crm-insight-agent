- metric: VIP_CONSUMPTION_BY_STORE
  title: 按门店统计要客消费
  domain: member
  status: CONFIRMED
  caliber: "按会员分配门店 member_allot_store 分组统计要客（track=1）的消费；
  2026-11-09 口径变更：消费总额改取 expense_calendar_info.expense_realamt（订单头实付汇总），
  不再使用 member_info_view.member_expense_totalsum（来源错误，粒度也不匹配）；
  主表=订单头（1 单 1 行），受控 LEFT JOIN member_info_view（m）按 expense_mobile=member_mobile 关联
  （真库 member_mobile 唯一 → 1:1 不乘行、金额不重复累计）；
  有效订单 expense_state='10' AND del_flag='0'（退单负行自然抵消）；要客=track=1 且会员 del_flag='0'；
  仅统计要客本人订单，未注册会员的订单不计入；
  指标不声明时间列，不传时间参数即全部历史累计；
  要客数在本粒度下为“有消费要客数”=COUNT(DISTINCT expense_mobile)，不等于 VIP_OVERVIEW 的当前要客总数；
  人均消费＝消费总额/有消费要客数（Java 端派生）；
  门店取分配门店，非注册门店，也非订单门店 expense_stationCode；
  与 CRM 会员列表页金额口径不同：CRM 用 18 个月快照 member_expense_totalsum_year（非实时、快照子查询未加 expense_state='10'），
  本指标用订单实付实时汇总，两者在退单处理与更新时点上可能不同，不得声称等价；
  不支持租户（2026-10-30 取消）"
  table: expense_calendar_info
  join:
    table: member_info_view
    alias: m
    mainAlias: e
    # 键必须加引号：SnakeYAML 会把未引号的 on 解析成布尔 true
    "on": "e.expense_mobile = m.member_mobile"
  grain: ORDER_HEAD
  timeColumn:
  baselineFilters:
    - "e.expense_state = '10'"
    - "e.del_flag = '0'"
    - "m.del_flag = '0'"
    - "m.track = 1"
  dimensions:
    - { code: STORE, expr: m.member_allot_store, alias: store_code }
  attributes:
    - { expr: m.member_allot_stationName, alias: store_name, agg: MAX }
  measures:
    - { code: VIP_BUYERS,   expr: "DISTINCT e.expense_mobile", agg: COUNT, alias: vip_count,     unit: COUNT, zeroFill: true }
    - { code: TOTAL_EXPENSE, expr: "NUM(e.expense_realamt)",    agg: SUM,   alias: total_expense, unit: CNY,   zeroFill: true, decimalScale: 2 }
    - { code: ORDERS,        expr: "*",                          agg: COUNT, alias: order_count,  unit: COUNT }
  optionalFilters:
    - { code: STORE, column: m.member_allot_store }
  derived:
    - { code: AVG_EXPENSE_PER_VIP, formula: "TOTAL_EXPENSE / VIP_BUYERS", scale: 2, unit: CNY }
  sortable: [ TOTAL_EXPENSE, VIP_BUYERS ]
  defaultSortBy: TOTAL_EXPENSE
  defaultSortDir: desc
  limitDefault: 100
  limitMax: 500
  withTotalRow: true
  nullDimensionLabel: 未知门店

- metric: VIP_BY_GENDER
  title: "按性别统计要客数"
  domain: member
  status: CONFIRMED
  caliber: "按性别（member_sex）分组统计当前要客数。要客＝track=1 的会员（2026-11-02 同步自 CRM 会员池脑图口径）；
  快照指标，不注入时间条件，总数不随时间窗口变化。有效会员限定 del_flag='0'。性别取 member_sex：1=男、2=女，其余（含枚举 0 与 NULL）归并展示为“未知性别”，不做丢弃。
  门店过滤用分配门店 member_allot_store（与 MEMBER_OVERVIEW / VIP_BY_STORE 一致），非注册门店 member_store。不支持租户维度筛选（2026-10-30 业务决策取消租户维度，统计聚焦门店）。
  数据来源 member_info_view（由触发器从 member_info 同步）。合计行为全量有效要客数，非分组行之外的增量口径。"
  table: member_info_view
  grain: MEMBER
  baselineFilters:
    - "del_flag = '0'"
    - "track = 1"
  dimensions:
    - { code: GENDER, alias: gender, expr: "CASE WHEN member_sex = '1' THEN '男' WHEN member_sex = '2' THEN '女' ELSE '未知性别' END" }
  attributes: []
  measures:
    - { code: VIP_COUNT, expr: "*", agg: COUNT, alias: vip_count, unit: COUNT }
  optionalFilters:
    - { code: STORE, column: member_allot_store }
  derived: []
  sortable: [VIP_COUNT]
  defaultSortBy: VIP_COUNT
  defaultSortDir: desc
  limitDefault: 100
  limitMax: 500
  withTotalRow: true
